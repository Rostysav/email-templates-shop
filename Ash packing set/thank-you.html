<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ash — Thank-you card</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #1A1814; }
    .mark {
      width: 42px; height: 42px; margin: 0 auto; border: 1px solid #1A1814;
      font-family: Georgia, "Times New Roman", serif; font-size: 24px; line-height: 40px; text-align: center;
    }
    .kicker {
      font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; letter-spacing: 0.18em;
      text-transform: uppercase; color: #6E675C; font-weight: 650;
    }
    .letter {
      font-family: Georgia, "Times New Roman", serif; font-size: 22px; line-height: 1.45;
      margin: 14px auto 0; max-width: 16em;
    }
    .word {
      font-family: Georgia, "Times New Roman", serif; font-size: 14px; letter-spacing: 0.28em;
      display: inline-block; padding-left: 0.28em;
    }
    .mail { font-family: "Segoe UI", Helvetica, Arial, sans-serif; color: #6E675C; font-size: 13px; margin-top: 8px; }
    .sheet { text-align: center; display: flex; flex-direction: column; }
    .body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .print {
      position: fixed; top: 16px; right: 16px; border: 1px solid #1A1814; background: #F7F3EA;
      color: #1A1814; font: 12px "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.14em;
      text-transform: uppercase; padding: 10px 14px; cursor: pointer;
    }
    @media screen {
      body { background: #E6DECF; padding: 36px 16px 64px; }
      .sheet {
        width: 5in; height: 7in; margin: 0 auto; padding: 0.5in 0.48in;
        background: #F7F3EA; box-shadow: 0 18px 50px rgba(40, 30, 20, 0.18);
      }
    }
    @media print {
      body { background: #fff; padding: 0; }
      .sheet { margin: 0; padding: 0; box-shadow: none; background: #fff; min-height: 6in; }
      .print { display: none; }
    }
    @page { size: 5in 7in; margin: 0.48in; }
  </style>
</head>
<body>
  <button class="print" onclick="window.print()">Print</button>
  <div class="sheet">
    <div class="mark">A</div>
    <div class="body">
      <div class="kicker">A note from the shop</div>
      <p class="letter">Packed by hand in Hudson. If something is not right, write to us before you decide to send it back.</p>
    </div>
    <div>
      <div class="word">ASH</div>
      <div class="mail">hello@ash.example</div>
    </div>
  </div>
</body>
</html>
